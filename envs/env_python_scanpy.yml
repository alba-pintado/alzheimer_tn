name: alzheimer_python
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  # ── TBB compatible con scanpy/numba ──
  # NO fijamos versión: conda resolverá >=2021 que necesita numba
  - tbb
  # ── Scanpy ecosystem ──
  - scanpy>=1.9
  - anndata
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - numba
  - leidenalg
  - python-igraph
  - umap-learn
  # ── Jupyter ──
  - jupyter
  - jupyterlab
  - ipykernel
  # ── Snakemake (aquí, no en el entorno R) ──
  - snakemake-minimal>=7.32
