name: alzheimer_R
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.4.2
  - r-essentials
  # ── Sin scanpy, sin numba, sin TBB conflict ──
  # TBB libre: conda resolverá la versión compatible con R solo
  - tbb                     # versión libre, conda-forge elegirá compatible
  - tbb-devel               # headers necesarios para compilar stringfish
  # ── Paquetes R desde conda (binarios precompilados contra TBB correcto) ──
  - r-stringfish            # dependencia raíz del problema, binario de conda-forge
  - r-qs                    # binario de conda-forge compilado contra el TBB de arriba
  - r-rcpp
  - r-rcppparallel
  # ── Bioconductor ──
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-scuttle
  - bioconductor-biocmanager
  - bioconductor-s4vectors
  # ── Análisis y visualización ──
  - r-seurat
  - r-matrix
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-patchwork
  - r-scales
  - r-viridis
  - r-pheatmap
  - r-cowplot
  - r-ggrepel
  # ── Jupyter kernel de R ──
  - r-irkernel
  - r-repr
  - r-irdisplay
  - jupyter
  - jupyterlab
