name: alzheimer_snRNA
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core
  - r-base=4.4.2
  - r-essentials
  # Lectura de datos
  - r-qs>=0.25.5          # CRÍTICO: versión 2 del formato
  - r-qs2                 # Alternativa si qs falla
  # Single-cell
  - r-seurat>=5.0.0
  - r-seuratobject
  - r-matrix
  # RaceID
  - r-raceid              # Incluye RaceID3 + StemID2 + VarID2
  # Análisis
  - r-dplyr
  - r-ggplot2
  - r-patchwork
  - r-scales
  - r-viridis
  - r-pheatmap
  # Jupyter
  - jupyter
  - r-irkernel
  # Snakemake
  - snakemake>=7.0
  - python>=3.10
